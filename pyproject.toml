[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nakis-otomasyon"
version = "0.1.0"
description = "PNG → DST embroidery automation for Tajima industrial machines"
requires-python = ">=3.11"
dependencies = [
    "pyembroidery>=1.4.36,<2.0",
    "Pillow>=10.0,<12.0",
    "numpy>=1.26,<3.0",
    "opencv-python>=4.9,<5.0",
    "scikit-learn>=1.4,<2.0",
    "shapely>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
nakis = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
